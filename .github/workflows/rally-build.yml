name: Rally conversion build

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/rally-car-conversion]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck, GLSL check, and production build
        run: npm run build
